name: Проверка деплоя
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Bash + ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Синтаксис Bash
        run: bash -n deploy.sh tests/integration.sh
      - name: ShellCheck
        run: shellcheck -S warning deploy.sh tests/integration.sh
      - name: Проверка аргументов и диагностики
        run: |
          bash deploy.sh --help
          bash deploy.sh --check
          if bash deploy.sh --unknown; then exit 1; fi
  integration:
    name: Установка и HTTPS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Реальный деплой + интеграционные проверки (лимит 170 секунд)
        shell: bash
        run: timeout -k 5s 170s bash tests/integration.sh
      - name: Логи при ошибке
        if: failure()
        run: |
          sudo systemctl status m-ui --no-pager || true
          sudo journalctl -u m-ui -n 100 --no-pager || true
          sudo systemctl list-timers --all --no-pager | grep -E 'acme|test-tspu' || true
