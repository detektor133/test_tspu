name: Проверка деплоя
on:
  # Ветки разработки проверяются по PR; не запускаем двойные сборки push + PR.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Не тратим время на устаревшие PR-коммиты, но не прерываем проверки main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: Bash + ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Синтаксис Bash
        run: |
          bash -n deploy.sh
          bash -n tests/integration.sh
          bash -n tests/proxy-e2e.sh
          bash -n bench/setup_termux.sh
      - name: Проверка Python-скриптов измерений
        run: |
          python3 -m py_compile bench/*.py
          python3 -m py_compile tests/test_*.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: ShellCheck
        run: shellcheck -S warning deploy.sh bench/setup_termux.sh tests/integration.sh tests/proxy-e2e.sh
      - name: Проверка аргументов и диагностики
        run: |
          bash deploy.sh --help
          bash deploy.sh --check
          if bash deploy.sh --unknown; then exit 1; fi
          if bash deploy.sh --ui-language fr; then exit 1; fi
  integration:
    name: Установка и HTTPS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Установить YAML-парсер для проверки клиентских профилей
        run: sudo apt-get install -y -qq python3-yaml
      - name: Реальный деплой + интеграционные проверки (лимит 170 секунд)
        shell: bash
        run: timeout -k 5s 170s bash tests/integration.sh
      - name: Логи при ошибке
        if: failure()
        run: |
          # m-ui логирует URL запросов, включая секретные токены подписок.
          sudo systemctl status m-ui --no-pager | grep -vE ' (GET|POST|PUT|DELETE) /' || true
          sudo journalctl -u m-ui -n 100 --no-pager | grep -vE ' (GET|POST|PUT|DELETE) /' || true
          sudo systemctl list-timers --all --no-pager | grep -E 'acme|test-tspu' || true

  debian-integration:
    name: Установка и HTTPS (debian-${{ matrix.release }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ['12', '13']
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Debian ${{ matrix.release }} с systemd
        shell: bash
        run: |
          docker build --quiet --build-arg DEBIAN_RELEASE=${{ matrix.release }} \
            -f tests/Dockerfile.debian -t test-tspu-debian:ci .
          docker run -d --name debian-integration --privileged \
            --cgroupns=host --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/workspace:ro" \
            test-tspu-debian:ci
          for attempt in {1..25}; do
            if [[ "$(docker inspect -f '{{.State.Running}}' debian-integration)" != true ]]; then
              echo 'Debian: systemd завершился при старте, состояние контейнера:' >&2
              docker inspect -f 'Код: {{.State.ExitCode}}; Ошибка: {{.State.Error}}' debian-integration >&2
              docker logs --tail 60 debian-integration >&2
              exit 1
            fi
            if docker exec debian-integration systemctl list-units --no-pager >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec debian-integration bash /workspace/deploy.sh --check-os
      - name: Реальный деплой + сквозные тесты в Debian (лимит 170 секунд)
        shell: bash
        run: docker exec -w /workspace debian-integration timeout -k 5s 170s bash tests/integration.sh
      - name: Диагностика при ошибке
        if: failure()
        run: |
          docker logs --tail 50 debian-integration 2>&1 | grep -vE ' (GET|POST|PUT|DELETE) /' || true
      - name: Завершить контейнер
        if: always()
        run: docker rm -f debian-integration >/dev/null 2>&1 || true
